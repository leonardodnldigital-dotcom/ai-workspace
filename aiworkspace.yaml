version: "3.7"

# ══════════════════════════════════════════════════════════════
# AI Workspace — Claude Code + Gemini + Qwen + Cursor + OpenCode + Codex + Cline + Aider
# ══════════════════════════════════════════════════════════════

services:
  aiworkspace:
    image: ghcr.io/leonardodnldigital-dotcom/ai-workspace:latest
    hostname: "{{.Service.Name}}.{{.Task.Slot}}"

    stdin_open: true
    tty: true

    ports:
      - target: 2222
        published: 2222
        protocol: tcp
        mode: host

    networks:
      - network_swarm_public

    environment:
      - TERM=xterm-256color
      - LANG=C.UTF-8

      # ── SSH (chave pública do host, injetada no boot) ──
      # Descomente e cole a chave pública do host da VPS
      # Execute: cat ~/.ssh/id_ed25519.pub
      # Isso garante que ai-ssh/ai-tunnel funcionem mesmo após rebuild da imagem.
      # - SSH_AUTHORIZED_KEYS=ssh-ed25519 AAAA... root@vps
      #
      # OPCIONAL - ao executar cada CLI consegue autenticar via oauth
      # - GEMINI_API_KEY=
      # - CURSOR_API_KEY=
      # - OPENCODE_API_KEY=
      # - CODEX_API_KEY=
      # - CLINE_API_KEY=
      # - AIDER_API_KEY=

    volumes:
      - aiworkspace_projects:/home/dev/projects
      - aiworkspace_config:/home/dev/.config
      - aiworkspace_claude:/home/dev/.claude
      - aiworkspace_gemini:/home/dev/.gemini
      - aiworkspace_qwen:/home/dev/.qwen
      - aiworkspace_cursor:/home/dev/.cursor
      - aiworkspace_opencode:/home/dev/.local/share/opencode
      - aiworkspace_codex:/home/dev/.codex
      - aiworkspace_cline:/home/dev/.cline
      - aiworkspace_aider:/home/dev/.aider
      - aiworkspace_agents:/home/dev/.agents
      - aiworkspace_ssh:/home/dev/.ssh

    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      resources:
        limits:
          cpus: "8"
          memory: 32G
        reservations:
          cpus: "0.5"
          memory: 512M

volumes:
  aiworkspace_projects:
    external: true
    name: aiworkspace_projects
  aiworkspace_config:
    external: true
    name: aiworkspace_config
  aiworkspace_claude:
    external: true
    name: aiworkspace_claude
  aiworkspace_gemini:
    external: true
    name: aiworkspace_gemini
  aiworkspace_qwen:
    external: true
    name: aiworkspace_qwen
  aiworkspace_cursor:
    external: true
    name: aiworkspace_cursor
  aiworkspace_opencode:
    external: true
    name: aiworkspace_opencode
  aiworkspace_codex:
    external: true
    name: aiworkspace_codex
  aiworkspace_cline:
    external: true
    name: aiworkspace_cline
  aiworkspace_aider:
    external: true
    name: aiworkspace_aider
  aiworkspace_agents:
    external: true
    name: aiworkspace_agents
  aiworkspace_ssh:
    external: true
    name: aiworkspace_ssh

networks:
  network_swarm_public:
    external: true
    name: network_swarm_public
